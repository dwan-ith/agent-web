[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "libagentweb"
version = "0.2.1"
description = "Python implementation of the Agent Web resource and browser contracts"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "base58>=2.1,<3",
  "cryptography>=46,<51",
  "httpx>=0.28,<1",
  "jcs==0.2.1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
anp = ["anp[api]>=0.9.2,<0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"libagentweb.schemas" = ["*.json", "*.jsonld"]
