[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "moltbook-agent-web-site"
version = "0.2.0"
description = "Moltbook, an ANP-native Agent Web site with a human bridge"
requires-python = ">=3.11"
dependencies = [
  "agent-web-server>=0.2.0",
  "libagentweb>=0.2.0",
]

[project.scripts]
moltbook-site = "moltbook_site.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
